<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chatbot Support IT</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto;
         padding: 0 16px; line-height: 1.5; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc;
          border-radius: 6px; }
  button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 6px;
           background: #2b5cff; color: #fff; cursor: pointer; }
  button:disabled { background: #9aa8d6; cursor: default; }
  #reponse { white-space: pre-wrap; background: #f5f6f8; padding: 16px;
             border-radius: 8px; }
  #reponse.refus { background: #fff4e5; border-left: 3px solid #e8a33d; }
  #reponse.erreur { background: #fdecec; border-left: 3px solid #d9534f; }
  .sources { margin-top: 20px; font-size: 0.9rem; color: #444; }
  .source { border-left: 3px solid #2b5cff; padding-left: 10px; margin: 10px 0; }
  #ticket { margin-top: 20px; padding: 16px; border: 1px solid #e0c48a;
            background: #fffaf0; border-radius: 8px; }
  #ticket[hidden] { display: none; }
  #ticket label { display: block; margin-top: 10px; font-size: 0.9rem; }
  #ticket input, #ticket textarea { width: 100%; box-sizing: border-box;
            padding: 8px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
  #ticket textarea { min-height: 70px; resize: vertical; }
  #ticket .actions { display: flex; gap: 8px; margin-top: 12px; }
  #ticket .secondaire { background: #e8e8e8; color: #1a1a1a; }
  #ticket .resultat { margin-top: 10px; }
</style>
</head>
<body>
  <h1>Chatbot de support informatique</h1>
  <form id="formulaire">
    <input id="question" placeholder="Posez votre question..." autocomplete="off" required>
    <button id="envoyer" type="submit">Envoyer</button>
  </form>

  <div id="reponse"></div>
  <div class="sources" id="sources"></div>

  <!-- Proposition de ticket GLPI : affichée uniquement après un refus,
       et seulement si GLPI est configuré côté serveur. -->
  <div id="ticket" hidden>
    <strong>Souhaitez-vous transmettre votre question au support ?</strong>
    <p style="margin:6px 0 0; font-size:0.9rem; color:#444">
      Un ticket GLPI sera créé avec votre question. Rien n'est envoyé tant que
      vous ne cliquez pas sur « Créer le ticket ».
    </p>
    <label>Précisions (facultatif)
      <textarea id="ticket-precisions" placeholder="Contexte, message d'erreur, ce que vous avez déjà essayé..."></textarea>
    </label>
    <label>Votre nom ou e-mail (facultatif)
      <input id="ticket-demandeur" autocomplete="off">
    </label>
    <div class="actions">
      <button type="button" id="ticket-creer">Créer le ticket</button>
      <button type="button" id="ticket-annuler" class="secondaire">Non merci</button>
    </div>
    <div class="resultat" id="ticket-resultat"></div>
  </div>

<script>
const formulaire = document.getElementById('formulaire');
const champ = document.getElementById('question');
const bouton = document.getElementById('envoyer');
const zoneReponse = document.getElementById('reponse');
const zoneSources = document.getElementById('sources');
const encartTicket = document.getElementById('ticket');
const champPrecisions = document.getElementById('ticket-precisions');
const champDemandeur = document.getElementById('ticket-demandeur');
const boutonCreer = document.getElementById('ticket-creer');
const boutonAnnuler = document.getElementById('ticket-annuler');
const resultatTicket = document.getElementById('ticket-resultat');

// Dernière question ayant reçu un refus : c'est elle qui partira dans le ticket.
let questionSansReponse = null;

// GLPI est-il configuré côté serveur ? Lu une fois au chargement.
let glpiDisponible = false;
fetch('/sante').then(r => r.json())
  .then(s => { glpiDisponible = !!s.glpi_configure; })
  .catch(() => {});

// Les extraits viennent des PDF : ils peuvent contenir < > & qui casseraient
// la page (ou y injecteraient du code) s'ils étaient insérés en HTML brut.
function echapper(texte) {
  return String(texte)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

formulaire.addEventListener('submit', async (evenement) => {
  evenement.preventDefault();
  const question = champ.value.trim();
  if (!question) return;

  bouton.disabled = true;
  zoneReponse.className = '';
  zoneReponse.textContent = 'Recherche en cours...';
  zoneSources.innerHTML = '';
  encartTicket.hidden = true;
  resultatTicket.textContent = '';

  try {
    // Appel de l'API définie dans src/api.py
    const reponseHttp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });

    if (!reponseHttp.ok) {
      // L'API renvoie {"detail": "..."} sur une erreur (422, 503...).
      let detail = 'HTTP ' + reponseHttp.status;
      try { detail = (await reponseHttp.json()).detail || detail; } catch (_) {}
      zoneReponse.className = 'erreur';
      zoneReponse.textContent = 'Erreur : ' + (typeof detail === 'string' ? detail : JSON.stringify(detail));
      return;
    }

    const donnees = await reponseHttp.json();
    zoneReponse.className = donnees.refus ? 'refus' : '';
    zoneReponse.textContent = donnees.reponse;

    if (donnees.refus && glpiDisponible) {
      questionSansReponse = question;
      champPrecisions.value = '';
      boutonCreer.disabled = false;
      encartTicket.hidden = false;
    }

    if (donnees.sources && donnees.sources.length) {
      zoneSources.innerHTML = '<strong>Sources :</strong>' +
        donnees.sources.map(s => `
          <div class="source">
            <div><b>${echapper(s.document)}</b>${s.page !== null && s.page !== undefined ? ' — page ' + (s.page + 1) : ''}
                 <span style="color:#888">(score ${echapper(s.score)})</span></div>
            <div>${echapper(s.extrait)}</div>
          </div>`).join('');
    }
  } catch (erreur) {
    zoneReponse.className = 'erreur';
    zoneReponse.textContent = 'Erreur : le serveur ne répond pas. ' + erreur;
  } finally {
    bouton.disabled = false;
  }
});

boutonAnnuler.addEventListener('click', () => {
  encartTicket.hidden = true;
});

// Création du ticket : uniquement sur ce clic explicite.
boutonCreer.addEventListener('click', async () => {
  if (!questionSansReponse) return;
  boutonCreer.disabled = true;
  resultatTicket.textContent = 'Création du ticket...';

  try {
    const reponseHttp = await fetch('/ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: questionSansReponse,
        precisions: champPrecisions.value,
        demandeur: champDemandeur.value
      })
    });
    const donnees = await reponseHttp.json();

    if (!reponseHttp.ok) {
      resultatTicket.innerHTML = '<span style="color:#b00">Le ticket n\'a pas pu être créé : '
        + echapper(donnees.detail || ('HTTP ' + reponseHttp.status)) + '</span>';
      boutonCreer.disabled = false;
      return;
    }

    resultatTicket.innerHTML = 'Ticket <b>n°' + echapper(donnees.id) + '</b> créé. '
      + '<a href="' + echapper(donnees.url) + '" target="_blank" rel="noopener">Voir dans GLPI</a>';
    champPrecisions.value = '';
  } catch (erreur) {
    resultatTicket.textContent = 'Erreur : le serveur ne répond pas. ' + erreur;
    boutonCreer.disabled = false;
  }
});
</script>
</body>
</html>
